<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>TIARA-1000 MQTT Console</title>
  <link rel="manifest" href="manifest.json?v=20260910a">
  <link rel="stylesheet" href="style.css?v=20260910a">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>TIARA-1000</h1>
      <div class="top-actions">
        <button id="openConfig" class="config-btn">MQTT Settings</button>
        <div id="statusDot" class="status-dot"></div>
      </div>
    </header>

    <section class="panel instrument-panel">
      <div class="instrument-row">
        <label for="instrumentSelect">Instrument</label>
        <select id="instrumentSelect"></select>
        <input id="instrumentIdInput" type="text" placeholder="Scan new QR or type ID">
        <button id="addInstrumentBtn">Add</button>
        <input id="instrumentNameInput" type="text" placeholder="Nickname for selected instrument">
        <button id="saveInstrumentNameBtn">Save Name</button>
        <button id="setCurrentDefaultBtn">Make Default</button>
        <button id="exportInstrumentsBtn">Export</button>
        <input id="importInstrumentsInput" type="file" accept="application/json" hidden>
        <button id="importInstrumentsBtn">Import</button>
        <button id="openInstrumentManagerBtn">Manage</button>
      </div>
    </section>

    <section class="panel">
      <div class="kpi">
        <div class="kpi-label">Measured Current</div>
        <div id="cur" class="kpi-value">--</div>
      </div>
      <div class="kpi-grid">
        <div><span class="muted">Range:</span> <span id="range">--</span></div>
        <div><span class="muted">Auto:</span> <span id="auto">--</span></div>
        <div><span class="muted">Output:</span> <span id="output">--</span></div>
        <div><span class="muted">Source:</span> <span id="source">--</span></div>
      </div>
    </section>

    <section class="panel controls">
      <div class="row">
        <button data-cmd="power">Power</button>
        <button data-cmd="auto">Auto</button>
        <button data-cmd="range:up">Range +</button>
        <button data-cmd="range:down">Range -</button>
        <button data-cmd="free_run">Free Run</button>
        <button data-cmd="source">Int/Ext</button>
      </div>
      <div class="row">
        <button id="outputOn">Output ON</button>
        <button id="outputOff">Output OFF</button>
      </div>
      <div class="row set-current">
        <input id="setVal" type="number" step="0.001" placeholder="Set current">
        <select id="setUnit">
          <option>mA</option>
          <option selected>uA</option>
          <option>nA</option>
        </select>
        <button id="applyCurrent">Apply</button>
      </div>
      <div class="row set-current">
        <label for="brightness" class="muted">Brightness</label>
        <input id="brightness" type="range" min="0" max="100" value="50">
        <span id="brightnessValue">50%</span>
      </div>
    </section>

    <section class="panel graph-panel">
      <div class="graph-row">
        <div id="graphLegend" class="graph-legend"></div>
        <div class="graph-wrap">
          <canvas id="currentGraph" class="graph-canvas" width="560" height="240"></canvas>
        </div>
      </div>
      <div id="foot" class="foot">Bootstrapping...</div>
    </section>
  </main>

  <dialog id="cfgDialog">
    <form method="dialog" id="cfgForm">
      <h2>MQTT Configuration</h2>
      <label>BROKER_HOST<input name="BROKER_HOST" required></label>
      <label>BROKER_PORT<input name="BROKER_PORT" type="number" min="1" max="65535" required></label>
      <label>MQTT_USERNAME<input name="MQTT_USERNAME"></label>
      <label>MQTT_PASSWORD<input name="MQTT_PASSWORD" type="password"></label>
      <label>MQTT_CLIENT_PREFIX<input name="MQTT_CLIENT_PREFIX"></label>
      <label>PROJECT_TOPIC_ROOT<input name="PROJECT_TOPIC_ROOT"></label>
      <label>WEBSITE_UNIQUE_ID<input name="WEBSITE_UNIQUE_ID"></label>
      <div class="row">
        <button id="saveCfg" value="default">Save</button>
        <button value="cancel">Close</button>
      </div>
    </form>
  </dialog>

  <dialog id="instrumentManagerDialog">
    <div class="instrument-manager">
      <h2>Manage Instruments</h2>
      <div id="instrumentManagerList" class="instrument-manager-list"></div>
      <div class="row">
        <button id="closeInstrumentManagerBtn" value="default">Close</button>
      </div>
    </div>
  </dialog>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="app.js?v=20260910a"></script>
</body>
</html>
